<span id="cb1-120"><a href="#cb1-120" aria-hidden="true" tabindex="-1"></a><span class="co"># Below is an example configuration for build commands</span></span>
<span id="cb1-121"><a href="#cb1-121" aria-hidden="true" tabindex="-1"></a><span class="co"># (uncomment and modify to use)</span></span>
<span id="cb1-122"><a href="#cb1-122" aria-hidden="true" tabindex="-1"></a></span>
<span id="cb1-123"><a href="#cb1-123" aria-hidden="true" tabindex="-1"></a><span class="co"># [[build commands]]</span></span>
<span id="cb1-124"><a href="#cb1-124" aria-hidden="true" tabindex="-1"></a><span class="co"># build_working_dir:      &lt;build working dir for all commands&gt;  # &lt;- paths relative to the workspace working dir (the first one in the list) are allowed</span></span>
<span id="cb1-125"><a href="#cb1-125" aria-hidden="true" tabindex="-1"></a><span class="co"># open_panel_on_build:    true  #  &lt;- any settings specified here will apply to all commands unless overridden</span></span>

<span id="cb1-127"><a href="#cb1-127" aria-hidden="true" tabindex="-1"></a><span class="co"># clear_build_output_before_running: false</span></span>
<span id="cb1-128"><a href="#cb1-128" aria-hidden="true" tabindex="-1"></a><span class="co"># error_regex:            &lt;compiler-specific error regex&gt;  # see examples below</span></span>

<span id="cb1-130"><a href="#cb1-130" aria-hidden="true" tabindex="-1"></a></span>
<span id="cb1-131"><a href="#cb1-131" aria-hidden="true" tabindex="-1"></a><span class="co"># [Debug Build And Run]   # &lt;- command name. Can be arbitrary</span></span>
<span id="cb1-132"><a href="#cb1-132" aria-hidden="true" tabindex="-1"></a><span class="co"># build_command:          jai main.jai  # should be an executable or a script</span></span>
<span id="cb1-133"><a href="#cb1-133" aria-hidden="true" tabindex="-1"></a><span class="co"># build_working_dir:      &lt;build working dir for this command only&gt;</span></span>
<span id="cb1-134"><a href="#cb1-134" aria-hidden="true" tabindex="-1"></a><span class="co"># timeout_in_seconds:     5             # if you don&#39;t want a timeout, don&#39;t specify it</span></span>
<span id="cb1-135"><a href="#cb1-135" aria-hidden="true" tabindex="-1"></a><span class="co"># run_command:            test.exe      # will be run if build succeeds</span></span>
<span id="cb1-136"><a href="#cb1-136" aria-hidden="true" tabindex="-1"></a><span class="co"># run_working_dir:        W:/focus      # working dir for the run command</span></span>
<span id="cb1-137"><a href="#cb1-137" aria-hidden="true" tabindex="-1"></a><span class="co"># key_binding:            F5</span></span>
<span id="cb1-138"><a href="#cb1-138" aria-hidden="true" tabindex="-1"></a></span>
<span id="cb1-139"><a href="#cb1-139" aria-hidden="true" tabindex="-1"></a><span class="co"># [Run]                   # &lt;- You could have commands that don&#39;t build anything and just run something</span></span>
<span id="cb1-140"><a href="#cb1-140" aria-hidden="true" tabindex="-1"></a><span class="co"># run_command:            test</span></span>
<span id="cb1-141"><a href="#cb1-141" aria-hidden="true" tabindex="-1"></a><span class="co"># run_working_dir:        /home/user/test</span></span>
<span id="cb1-142"><a href="#cb1-142" aria-hidden="true" tabindex="-1"></a><span class="co"># key_binding:            Ctrl-F5</span></span>
<span id="cb1-143"><a href="#cb1-143" aria-hidden="true" tabindex="-1"></a></span>
<span id="cb1-144"><a href="#cb1-144" aria-hidden="true" tabindex="-1"></a><span class="co"># [Release]</span></span>
<span id="cb1-145"><a href="#cb1-145" aria-hidden="true" tabindex="-1"></a><span class="co"># build_command:          jai first.jai - release</span></span>
<span id="cb1-146"><a href="#cb1-146" aria-hidden="true" tabindex="-1"></a><span class="co"># key_binding:            F9</span></span>
<span id="cb1-147"><a href="#cb1-147" aria-hidden="true" tabindex="-1"></a></span>
<span id="cb1-148"><a href="#cb1-148" aria-hidden="true" tabindex="-1"></a></span>
<span id="cb1-149"><a href="#cb1-149" aria-hidden="true" tabindex="-1"></a><span class="co"># Example error regexes:</span></span>
<span id="cb1-150"><a href="#cb1-150" aria-hidden="true" tabindex="-1"></a><span class="co"># For Odin:   ^(?P&lt;file&gt;.*)\((?P&lt;line&gt;\d+):(?P&lt;col&gt;\d+)\) (?P&lt;type&gt;Error|Syntax Error): (?P&lt;msg&gt;.*)$</span></span>
<span id="cb1-151"><a href="#cb1-151" aria-hidden="true" tabindex="-1"></a><span class="co"># For jai:    ^(?P&lt;file&gt;.*):(?P&lt;line&gt;\d+),(?P&lt;col&gt;\d+): (?P&lt;type&gt;Error|Warning|Info|...):* (?P&lt;msg&gt;.*)|^(?P&lt;msg1&gt;.*error LNK.*)</span></span>
<span id="cb1-152"><a href="#cb1-152" aria-hidden="true" tabindex="-1"></a><span class="co"># For msvc:   ^(?P&lt;file&gt;.*)\((?P&lt;line&gt;\d+),?(?P&lt;col&gt;\d+)?\)[ ]?: (?P&lt;type&gt;error|warning) (?P&lt;msg&gt;.*)$</span></span>
<span id="cb1-153"><a href="#cb1-153" aria-hidden="true" tabindex="-1"></a><span class="co"># For golang: ^(?P&lt;file&gt;.*):(?P&lt;line&gt;\d+):(?P&lt;col&gt;\d+): (?P&lt;msg&gt;.*)$</span></span>
<span id="cb1-154"><a href="#cb1-154" aria-hidden="true" tabindex="-1"></a><span class="co"># For gcc:    ^(?P&lt;file&gt;.*):(?P&lt;line&gt;\d+):(?P&lt;col&gt;\d+): (?P&lt;type&gt;error|warning): (?P&lt;msg&gt;.*) (\[(?P&lt;msg1&gt;.*)\])?$</span></span>
<span id="cb1-155"><a href="#cb1-155" aria-hidden="true" tabindex="-1"></a><span class="co"># ... let us know what regex works for you and we&#39;ll add it here</span></span>
<span id="cb1-156"><a href="#cb1-156" aria-hidden="true" tabindex="-1"></a></span>
<span id="cb1-157"><a href="#cb1-157" aria-hidden="true" tabindex="-1"></a><span class="co"># </span><span class="al">NOTE</span><span class="co">:</span></span>
<span id="cb1-158"><a href="#cb1-158" aria-hidden="true" tabindex="-1"></a><span class="co"># You can use the following variables in build commands:</span></span>
<span id="cb1-159"><a href="#cb1-159" aria-hidden="true" tabindex="-1"></a><span class="co"># %FILE%      - full path to currenly active file</span></span>
<span id="cb1-160"><a href="#cb1-160" aria-hidden="true" tabindex="-1"></a><span class="co"># %FILE_DIR%  - the directory of the currently active file</span></span>

<span id="cb1-164"><a href="#cb1-164" aria-hidden="true" tabindex="-1"></a><span class="co"># %RUN_WORKING_DIR%    - working dir of the run command</span></span>
<span id="cb1-165"><a href="#cb1-165" aria-hidden="true" tabindex="-1"></a><span class="co"># %PROJECT_CONFIG_DIR% - the dir containing the active project config file</span></span>
