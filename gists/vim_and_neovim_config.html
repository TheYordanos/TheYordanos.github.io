<pre><code>&quot; =============================================================================
&quot; GENERAL SETTINGS
&quot; =============================================================================
set nocompatible
syntax on
filetype on
set termguicolors
colorscheme slate

set encoding=UTF-8
set fileencoding=utf-8
set updatetime=250
set timeoutlen=400

set undofile
set undodir=~/.vim/undodir

set number
set relativenumber
set numberwidth=4
set signcolumn=yes

set nocursorline
set scrolloff=8
set sidescrolloff=8
set wrap nowrap
set breakindent
set whichwrap+=&lt;,&gt;,[,],h,l

set mouse=a
set belloff=all
set showmatch
set showcmd
set showmode
set cmdheight=1
set showtabline=2
set laststatus=2
set shortmess+=c

set statusline=%f%=%l/%L

set incsearch
set hlsearch
set ignorecase
set smartcase

set wildmenu
set wildmode=longest:full,full
set wildignorecase
set wildignore=*.docx,*.jpg,*.png,*.gif,*.pdf,*.pyc,*.exe,*.flv,*.img,*.xlsx
set completeopt=menuone,noselect
set pumheight=10

set autoindent
set smartindent
set tabstop=4
set softtabstop=4
set shiftwidth=4

set backspace=indent,eol,start
set iskeyword+=-

set nobackup
set nowritebackup
set noswapfile
set confirm
set path+=**

set splitbelow
set splitright

&quot; Netrw (File Explorer)
let g:netrw_banner=0
let g:netrw_liststyle=3
let g:netrw_showhide=1
let g:netrw_winsize=20
let g:netrw_fastbrowse = 0
let g:netrw_keepdir = 0

&quot; =============================================================================
&quot; KEYMAPS
&quot; =============================================================================
let mapleader = &quot; &quot;
let maplocalleader = &quot; &quot;

&quot; General Shortcuts
nnoremap &lt;Space&gt; &lt;Nop&gt;
vnoremap &lt;Space&gt; &lt;Nop&gt;
noremap ; :
nnoremap &lt;Esc&gt; :noh&lt;CR&gt;

nnoremap &lt;C-s&gt; :w&lt;CR&gt;
nnoremap &lt;leader&gt;s :w&lt;CR&gt;
nnoremap &lt;C-q&gt; :q&lt;CR&gt;
nnoremap &lt;leader&gt;a ggVG

&quot; Navigation &amp; Movement
nnoremap &lt;expr&gt; k v:count == 0 ? &#39;gk&#39; : &#39;k&#39;
nnoremap &lt;expr&gt; j v:count == 0 ? &#39;gj&#39; : &#39;j&#39;
noremap &lt;C-k&gt; {
noremap &lt;C-j&gt; }
nnoremap &lt;C-d&gt; &lt;C-d&gt;zz        &quot; Scroll and center
nnoremap &lt;C-u&gt; &lt;C-u&gt;zz
nnoremap n nzzzv              &quot; Search and center
nnoremap N Nzzzv

nnoremap &lt;leader&gt;v &lt;C-w&gt;v     &quot; Vertical split
nnoremap &lt;leader&gt;h &lt;C-w&gt;s     &quot; Horizontal split
nnoremap &lt;leader&gt;se &lt;C-w&gt;=    &quot; Equalize splits
nnoremap &lt;leader&gt;q :close&lt;CR&gt; &quot; Close current split

nnoremap &lt;A-k&gt; :wincmd k&lt;CR&gt;
nnoremap &lt;A-j&gt; :wincmd j&lt;CR&gt;
nnoremap &lt;A-h&gt; :wincmd h&lt;CR&gt;
nnoremap &lt;A-l&gt; :wincmd l&lt;CR&gt;

nnoremap &lt;Up&gt; :resize -2&lt;CR&gt;
nnoremap &lt;Down&gt; :resize +2&lt;CR&gt;
nnoremap &lt;Left&gt; :vertical resize -2&lt;CR&gt;
nnoremap &lt;Right&gt; :vertical resize +2&lt;CR&gt;

nnoremap &lt;leader&gt;n :tabnew&lt;CR&gt;
nnoremap &lt;leader&gt;x :tabclose&lt;CR&gt;
nnoremap &lt;TAB&gt; :tabn&lt;CR&gt;
nnoremap &lt;S-TAB&gt; :tabp&lt;CR&gt;

nnoremap x &quot;_x
nnoremap &lt;leader&gt;+ &lt;C-a&gt;
nnoremap &lt;leader&gt;- &lt;C-x&gt;
nnoremap &lt;leader&gt;lw :set wrap!&lt;CR&gt;

&quot; Mode Tweaks
vnoremap &lt; &lt;gv
vnoremap &gt; &gt;gv
vnoremap p &quot;_dP
vnoremap fj &lt;ESC&gt;
vnoremap jf &lt;ESC&gt;

inoremap /* /**/&lt;left&gt;&lt;left&gt;
inoremap fj &lt;ESC&gt;
inoremap jf &lt;ESC&gt;

&quot; Clipboard
noremap &lt;leader&gt;y &quot;+y
noremap &lt;leader&gt;p &quot;+p
noremap &lt;leader&gt;P &quot;+P

&quot; File Explorer &amp; Terminal
noremap &lt;silent&gt; &lt;leader&gt;e :Lex&lt;CR&gt;
noremap &lt;leader&gt;o :Explore&lt;CR&gt;
noremap &lt;a-`&gt; :ter&lt;CR&gt;
tnoremap &lt;a-`&gt; exit&lt;CR&gt;
tnoremap &lt;c-i&gt; &lt;c-w&gt;&lt;s-n&gt;
tnoremap &lt;Esc&gt; &lt;C-\&gt;&lt;C-n&gt;

&quot; Quick file find
nnoremap &lt;leader&gt;ff :find *
nnoremap &lt;leader&gt;fs :sfind *
nnoremap &lt;leader&gt;fv :vert sfind *</code></pre>
